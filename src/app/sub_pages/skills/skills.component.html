<div id="skills_subpage" class="flex flex-col gap-2 bg-slate-950/[0.05] dark:bg-white/[0.04] border-black/[0.05] dark:border-white/[0.08] rounded-sm p-2 border-1">
    <div class="bg-white/[0.9] dark:bg-zinc-900/[0.9] hover:bg-white-50/[0.01] dark:hover:bg-white/[0.04] border-black/[0.2] dark:border-white/[0.12] hover:border-black/[0.3] dark:hover:border-white/[0.25] p-5 rounded-xl border-1">
        <div class="flex justify-between">
            <h2 class="font-normal font-roboto text-lg  mb-2 uppercase">Skills</h2>
        </div>
    
        <p class="font-extralight font-roboto text-[15px] text-black/[0.8] dark:text-zinc-300">
            Here are some of the key skills I possess, reflecting my expertise, experience, and dedication to delivering high-quality results across various projects and professional environments.
        </p>

    </div>
    <div>
    
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-x-2 gap-y-2">
            <div *ngFor="let group of skillsData" class="relative hover:z-10 flex flex-col sm:flex-row items-start sm:items-center gap-3 justify-between min-w-0 bg-white dark:bg-zinc-900 shadow hover:shadow-2xl hover:shadow-black shadow-black/[0.01] dark:shadow-black/[0.4] transition-all border border-gray-200 dark:border-zinc-700 p-2 rounded-xl group">
               
                <h3 class="font-light text-sm font-roboto uppercase transition">{{ group.skill_title }}</h3>
                
                <div class="flex space-x-1 flex-wrap">
                    <div *ngFor="let skill of group.skills" class="flex items-center flex-row space-x-4 justify-between">
                        <div class="w-10 h-10 rounded-lg flex items-center justify-center"
                            [ngStyle]="{ 'background-color': skill.color}" [title]="skill.skill_label">
                            <img [src]="skill.skill_icon" alt=" " class="w-6 h-6">
                        </div>
                    </div>
                </div>
                
            </div>
        </div>
    </div>
    
      
</div>
